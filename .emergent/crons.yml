crons:
  - name: nightly-import
    description: "Runs enabled source adapters (Upornia/XVideos/XNXX) at 03:00 UTC to import fresh videos"
    cron: "0 3 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/nightly-import"
    method: POST
    enabled: true
