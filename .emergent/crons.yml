crons:
  - name: live-import
    description: "Runs enabled source adapters (Upornia/XVideos/XNXX) every 6 hours so returning visitors always see fresh videos"
    cron: "0 */6 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/nightly-import"
    method: POST
    enabled: true
  - name: daily-suggest
    description: "Proposes up to 3 draft landing pages from freshest zero-result search keywords"
    cron: "30 3 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-suggest"
    method: POST
    enabled: true
  - name: weekly-digest
    description: "Every Monday 09:00 UTC — emails the owner a summary of new drafts, top searches and best landings"
    cron: "0 9 * * 1"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    enabled: true
  - name: dead-cleanup
    description: "Streams the official XVideos 7-day deleted-URL feed nightly and hides unavailable videos"
    cron: "15 4 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/dead-cleanup"
    method: POST
    enabled: true
