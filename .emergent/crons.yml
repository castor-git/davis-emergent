crons:
  - name: live-import
    description: "Runs enabled source adapters (Upornia/XVideos/XNXX) every 6 hours so returning visitors always see fresh videos"
    cron: "0 */6 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/nightly-import"
    method: POST
    enabled: true
